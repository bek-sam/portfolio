<!doctype html>
<!-- Source for public/og.png (1200x630 link-preview card). Regenerate with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b0b0c; color: #ecebe8; font-family: Geist, sans-serif;
    display: flex; align-items: center; gap: 64px; padding: 0 88px;
    background-image:
      radial-gradient(ellipse 70% 80% at 15% 10%, rgba(180,244,97,0.10), transparent 60%),
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: auto, 64px 64px, 64px 64px;
  }
  img { width: 260px; height: 260px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.16); flex-shrink: 0; }
  .pill { display: inline-flex; align-items: center; gap: 10px; font-family: "Geist Mono", monospace; font-size: 20px; color: #a19e98; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 8px 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b4f461; }
  h1 { font-size: 76px; font-weight: 600; letter-spacing: -2.5px; line-height: 1; margin-top: 28px; }
  h1 em { font-family: "Instrument Serif", serif; font-weight: 400; font-style: italic; color: #a19e98; letter-spacing: -0.5px; font-size: 84px; }
  .role { font-size: 32px; margin-top: 22px; }
  .role span { color: #a19e98; }
  .url { font-family: "Geist Mono", monospace; font-size: 26px; color: #b4f461; margin-top: 30px; }
</style>
</head>
<body>
  <img src="../public/bek.jpg" alt="">
  <div>
    <div class="pill"><span class="dot"></span>Open to new-grad SWE / AI roles · 2027</div>
    <h1>Bekbolsun<br><em>Samaganov</em></h1>
    <p class="role">Software Engineer <span>· AI agents · full-stack · native apps</span></p>
    <p class="url">www.bek-sam.dev</p>
  </div>
</body>
</html>
